# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Go Test

# Go Test — the CLI's Go unit-test gate (cli/cmd/**, cli/internal/**).
#
# Why this workflow exists (STATBUS-024): before it, NO workflow, dev.sh path,
# or git hook ran `go test`. The ~44 cli/**/*_test.go files — inject, the
# upgrade/recovery self-heal suite (039: ground_truth/postswap/backup), install
# state, release, migrate, … — compiled and passed only when a developer ran
# them locally. CI never executed them, so a Go test could rot silently while
# still "present". These guard LIVE upgrade/recovery code, so they must run on
# every change.
#
# Why a dedicated lane (not bolted onto an existing one): `go test ./...` is
# pure Go — no Docker, no DB, no external server — and finishes in well under a
# minute. fast-tests.yaml is gated behind Images on master (workflow_run) and
# skipped entirely if Images fails; test-hardening.yaml only runs at RC-tag
# time. Both would make the Go gate depend on Docker and/or run too rarely.
# This lane runs in parallel with Images on master and on every non-ops PR.
#
# Strict gate (the King is firm on strict-gating, no hedges): `go vet` then
# `go test ./...`. Both exit non-zero on any failure and fail the job — no
# continue-on-error, no `|| true`. A red Go test blocks the merge.

# STATBUS-219 Stage 2 (doc-030, architect comment #11): this workflow is an
# INDEPENDENT trigger — nothing chains off it — so a board-only push that
# matches paths-ignore below produces NO run at all, with no conclusion for
# anything downstream to misread (unlike pg_regress/fast-tests, which are
# workflow_run-chained off Images and therefore MUST keep running
# unconditionally; see pg_regress.yaml's own comment for why that half was
# ruled explicitly OUT of scope here). The resulting Missing at the tip is
# exactly what STATBUS-219 Stage 1's ancestor-ride in the release preflight
# was built and RED-verified to cover.
#
# paths-ignore IS A THIRD COPY of ops/release/ci-exempt-paths.txt's content
# — GitHub evaluates path filters server-side, before any job or checkout
# runs, so there is no way to read the checked-in list at trigger-filter
# time. KEPT IN SYNC BY HAND: this list, app_build_and_lint-workflow.yaml's
# matching push.paths-ignore, and ci-exempt-paths.txt must all change
# together — ci-exempt-paths.txt's own header now points back at both.
on:
  push:
    branches: [master]
    paths-ignore:
      - '.backlog/**'
  pull_request:
    branches-ignore:
      - 'ops/**'
  workflow_dispatch:

# Per-commit groups on master (each commit's run is its own verdict, never
# cancelled); per-ref groups on PRs (cancel superseded runs).
concurrency:
  group: go-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go-test:
    name: cli go test ./...
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Most git-touching tests build throwaway fixture repos in temp dirs
          # (git init / -C <dir>) and are checkout-depth-independent, but a few
          # (cmd/release_verify_test.go) run `git rev-parse HEAD` against the
          # checkout — fetch full history so commit/tag lookups resolve.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          # STATBUS-235: go.mod/go.sum live in cli/, not the repo root —
          # without this, setup-go's cache lookup silently never found
          # go.sum ("Restore cache failed: Dependencies file is not
          # found..."), so GOCACHE was never actually restored and every
          # run rebuilt/retested from scratch (STATBUS-234 comment #1).
          # SAFE ONLY because STATBUS-234's `-count=1` is on the go test
          # invocation below/in this same job — that flag is what forces
          # every test to re-examine reality regardless of cache state;
          # never remove -count=1 from a Go test invocation in this repo.
          cache-dependency-path: cli/go.sum

      - name: go vet
        working-directory: cli
        run: go vet ./...

      - name: go test
        working-directory: cli
        # STATBUS-234: -count=1 disables Go's test cache. Several of our
        # most important tests are PINS that read files OUTSIDE the module
        # (workflow YAML, ops/release/*.txt, shell scripts) and assert
        # facts about them — the arc-path pin, the run.sh marker pin, the
        # images-never-rides pin, the tag-trigger pins, the exempt-list
        # equality pin. The cache evidently fails to track such outside files
        # (the LIKELY mechanism — cmd/go does attempt runtime file
        # tracking via testlog, so this is not a confirmed internals
        # fact), and a cached "ok" can then vouch for outside-module
        # content that has since changed without ever re-reading it.
        # Demonstrated, not reasoned (engineer,
        # 2026-08-18): prime the cache with a green run, append an entry to
        # ops/release/ci-exempt-paths.txt, re-run without -count=1 — "ok
        # (cached)", a green that examined nothing current. doc-033's
        # zero-scope-green class, instance seven.
        run: go test ./... -count=1

  # go-lint (STATBUS-176) — King-approved quality gate: staticcheck, errcheck,
  # ineffassign, nilness, exactly (cli/.golangci.yml pins the analyzer set and
  # disables golangci-lint's own default issue caps — max-issues-per-linter /
  # max-same-issues — which silently truncated the FIRST inventory of this
  # gate's findings; the config here is what makes `golangci-lint run` in cli/
  # match this job byte-for-byte). Strict per the ratified strict-gating
  # doctrine (same shape as go-test above): no continue-on-error. The ONLY
  # bypass is the loud, explicit SKIP_GO_LINT=1 repository variable — never a
  # silently-tolerated red job. Separate job (not a step bolted onto go-test)
  # so its own red/green verdict is unambiguous and it can be gated on
  # independently by the release checker.
  go-lint:
    name: cli golangci-lint (staticcheck, errcheck, ineffassign, nilness)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          # STATBUS-235: go.mod/go.sum live in cli/, not the repo root —
          # without this, setup-go's cache lookup silently never found
          # go.sum, so GOCACHE was never actually restored and every run
          # rebuilt from scratch (STATBUS-234 comment #1). This job never
          # runs `go test` (it runs golangci-lint via `./dev.sh lint`,
          # which typechecks the actual source it's given — no
          # outside-module blind spot the way a pin TEST has), so caching
          # it carries none of the STATBUS-234 staleness risk; unlike the
          # go-test job above, this one doesn't depend on -count=1 for
          # safety.
          cache-dependency-path: cli/go.sum

      - name: SKIP_GO_LINT bypass notice
        if: ${{ vars.SKIP_GO_LINT == '1' }}
        run: |
          echo "::warning::SKIP_GO_LINT=1 is set — the golangci-lint gate is BYPASSED for this run. This must be a deliberate, temporary operator decision (a repository variable someone set on purpose), never a silent default."
          echo "⚠️⚠️⚠️  golangci-lint gate BYPASSED (SKIP_GO_LINT=1)  ⚠️⚠️⚠️"

      - name: Install golangci-lint
        if: ${{ vars.SKIP_GO_LINT != '1' }}
        # Fetch install.sh from the SAME pinned tag as the binary. The previous
        # form curled install.sh from MASTER while pinning the binary to
        # v2.12.2 — when upstream's master rotated its checksum table past our
        # pin, the download failed hash verification and this lane sat red from
        # 2026-07-29 (checksum mismatch, not a product failure). Pinning both
        # sides to one tag removes the version skew by construction.
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: gofmt (strict)
        # STATBUS-290. Its own named step, BEFORE golangci-lint: gofmt has
        # repeatedly caught what the linter did not (three times in one week,
        # per the freeze reports on 229/233/237), so it must have its own
        # red/green verdict rather than being folded into another step whose
        # failure would name the wrong thing.
        #
        # STRICT, no continue-on-error, no `|| true` — the ratified strict-
        # gating doctrine, same shape as `go vet` / `go test` / this job's
        # golangci-lint. gofmt was previously a MANUAL freeze-report step that
        # every agent was asked to remember; six files in cmd/ and five in
        # internal/ accumulated anyway. An advisory check is how that happens.
        #
        # NOT under SKIP_GO_LINT. That bypass exists for golangci-lint, whose
        # third-party install step has failed for reasons unrelated to our code
        # (an upstream checksum rotation left this lane red for weeks). gofmt
        # ships with the Go toolchain that is already set up above — it has no
        # such failure mode, so it needs no escape hatch, and giving it one
        # would only widen what a single variable silently switches off.
        #
        # `./dev.sh gofmt` is the ONE definition (STATBUS-230's rule, the same
        # reason the next step calls `./dev.sh lint`): it pins the working
        # directory, refuses a zero-scope run, and prints the file list with
        # the remedy. CI and a developer run the identical check.
        run: ./dev.sh gofmt

      - name: golangci-lint run
        if: ${{ vars.SKIP_GO_LINT != '1' }}
        # STATBUS-230: `./dev.sh lint` is the ONE definition of this check —
        # it pins cli/ itself (no `working-directory:` needed here) and
        # refuses a zero-scope run instead of letting golangci-lint print
        # "0 issues" after failing to resolve the module and exit 0 anyway.
        # CI and the local three-step chain (test, gofmt, lint) now call
        # the SAME target instead of CI keeping its own hand-pinned copy of
        # this one command.
        run: ./dev.sh lint
