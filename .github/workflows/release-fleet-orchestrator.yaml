# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Fleet Orchestrator

# Release Fleet Orchestrator (STATBUS-214).
#
# THE DEFECT THIS REPLACES: test-install.yaml, install-recovery-harness.yaml
# and upgrade-arc-harness.yaml used to share ONE concurrency group
# (hetzner-vm-fleet, STATBUS-208) so their combined VM demand stayed under
# the Hetzner project server limit when a single v*-rc.* tag push fired all
# three at once. That serialized 2 fleets safely but not 3: a concurrency
# group keeps at most ONE running + ONE pending run — a THIRD run queuing
# behind them CANCELS the previously-pending one (cancel-in-progress:false
# protects only the RUNNING run, never the pending one). Live twice: at
# v2026.08.0-rc.02 (Upgrade Arc Harness cancelled, zero jobs) and again at
# rc.03 (Test Install cancelled, zero jobs, run 32115159028) — the third
# fleet to arrive lost its proof both times.
#
# THE FIX: this workflow is now the ONLY thing the v*-rc.* tag fires. It
# dispatches the three fleets ONE AT A TIME, cheapest-first
# (test-install -> install-recovery-harness -> upgrade-arc-harness) via an
# explicit needs: chain, each fleet run started with `gh workflow run --ref
# <tag>` and then polled to its conclusion — never `gh run watch
# --exit-status` (it has returned 0 for a FAILED run in this org's own
# deploy history; see CLAUDE.md). Deterministic order, zero cancellation
# surface: nothing is ever queued behind anything, because each fleet is
# only dispatched after the previous one's conclusion is already known.
#
# WHY gh-dispatch, NOT workflow_call (the ruling's other option — STATBUS-214
# AC#2): probed empirically before any wiring, the same one-shot method as
# STATBUS-215's probe. A throwaway caller+callee pair pushed to a scratch
# branch showed a `workflow_call` invocation executes the callee's jobs
# INSIDE the caller's own run — GitHub never creates a separate run object
# for the callee (caller run 32116960098, callee job surfaced only as the
# nested job "call-callee / noop"). The callee's OWN
# `actions/workflows/<file>/runs` listing — the exact query the release
# gates already run, `GET .../actions/workflows/<file>/runs?head_sha=<sha>`
# (release.CheckWorkflowAtCommit, cli/internal/release/workflow_check.go:115)
# — came back HTTP 404, no run identity at all. workflow_call would have
# silently broken every existing gate call site the moment this workflow
# landed. `gh workflow run --ref <tag>` keeps each fleet's own run identity
# intact instead: proven already outside this probe too — the rc.02
# hand-dispatch of upgrade-arc-harness (run 32009980725) was found by the
# gate at its rcCommit under this exact mechanism.
#
# Each inner fleet keeps its own workflow_dispatch (manual/subset runs) and
# its own max-parallel (peak per-fleet VM demand is unchanged — this
# workflow never runs two fleets at once, so total demand across the whole
# chain never exceeds one fleet's own peak, which already fits the Hetzner
# limit). The shared hetzner-vm-fleet concurrency group STAYS on all three
# inner fleets (see each one's own concurrency: comment) as defense in
# depth against a stray manual workflow_dispatch racing this orchestrator's
# own sequential dispatch — it no longer does the tag-push serialization
# job (this workflow's needs: chain does that now), but it still stops two
# independently-triggered runs of the SAME fleet from ever running
# concurrently. Keeping that group is safe ONLY together with the other
# half of this same decision: the poll below treats ANY non-success
# conclusion as a failure, so if the group's one-pending-slot rule ever
# cancels an orchestrator-dispatched fleet run, the chain reddens loudly
# with the run URL instead of hanging or silently passing. Neither half is
# safe alone.
#
# RUN CORRELATION (GitHub gives `gh workflow run` no run id back): each
# fleet job below dispatches via the LOCAL COMPOSITE ACTION
# .github/actions/dispatch-fleet-and-wait (STATBUS-225 — extracted from
# three near-identical ~70-line inline copies, one per job, that used to
# live directly in this file; the deploy-to-*.yaml convention of keeping
# these dispatch/poll loops inline at their call site is deliberate ACROSS
# files, where each copy has an independent reason to exist — inside ONE
# file, three copies of the same subtle correlation rule just drift, and
# the STATBUS-214 amendment below had to be re-applied three times
# correctly to prove the point). The action snapshots the matching
# (workflow, commit, event=workflow_dispatch) run ids BEFORE dispatching,
# then takes the SET DIFFERENCE against the same query after dispatching.
# Exactly one new id is ours; zero means keep polling; more than one is
# genuinely ambiguous and fails loud naming every candidate, rather than
# guessing. (An earlier draft used a `sort_by(.createdAt) | last` timestamp
# heuristic — wrong in exactly the case it could go wrong, since our own
# dispatch is always the FIRST one issued after the snapshot, making it the
# OLDEST of any competing candidates, not the newest. Caught in review
# before landing — see the action's own file for the full mechanism.)
#
# UPGRADE-SENSITIVITY GATE (STATBUS-223): the `decide-upgrade-sensitivity`
# job below decides whether the upgrade-arc-harness fleet is worth
# dispatching at all — a ratified STATBUS-199 D2 cost shortcut (an RC that
# changed nothing an upgrade touches proves nothing new by re-running the
# 31-machine suite; inherit the previous release's proof instead). This
# decision USED TO live inside upgrade-arc-harness.yaml itself (a `decide`
# job gated on `github.event_name == 'push'`), and broke silently the
# moment this orchestrator took over the tag trigger: every dispatch from
# here arrives as workflow_dispatch, an event type that job never ran on,
# so it stopped firing and every RC paid the full 3-hour fleet cost
# regardless of sensitivity. Rather than re-plumb an event-type workaround
# into the fleet, the decision moved to where the tag push actually lands
# now — HERE — and the fleet's now-dead copy of the machinery (the
# `decide` job, discover's RIDE early-exit, no-arcs-guard's RIDE
# exemption, construct's RIDE clause) was deleted rather than left as
# unreachable cover. ONLY the upgrade-arc-harness fleet is skip-eligible —
# test-install and install-recovery-harness always run, because a change
# that isn't upgrade-sensitive can still break a fresh install or a
# recovery scenario. AUTHORITY IS UNCHANGED: the stable release gate
# (cli/cmd/release.go, checkUpgradeArcHarnessGate) computes this same
# sensitivity walk independently and never trusts this job's verdict — a
# skipped dispatch just leaves no run at that commit, which the gate's
# existing Missing→path-sensitivity-walk already handles exactly as it
# does for any other incomplete or absent green. A manual
# workflow_dispatch of upgrade-arc-harness.yaml directly (bypassing this
# orchestrator) is never gated on sensitivity — that workflow no longer
# has any sensitivity logic of its own at all, so a human who dispatches
# it always gets their selected arcs, unconditionally.
#
# See doc/release-workflow-gates.md and STATBUS-208 for the fuller history.

on:
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch: {}

concurrency:
  # PER-TAG (STATBUS-246 AC#9, architect's ruling). The trade that looked hard
  # dissolves once you notice WHAT this workflow is: it rents no machines. It
  # occupied a shared capacity slot for HOURS purely to coordinate, which is why
  # a newer candidate's chain used to queue behind an old one — the supersession
  # disturbing the very chain that superseded it, which AC#9 forbids.
  #
  # Each candidate now gets its own group, so a new chain starts AT ONCE. The
  # STATBUS-208 protection is untouched: the four fleet workflows keep the
  # shared hetzner-vm-fleet group and serialize among themselves at the layer
  # that actually rents machines. Coordination is not a scarce resource; VMs are.
  group: release-fleet-orchestrator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read   # checkout — STATBUS-225: local composite action reference
                   # (./.github/actions/dispatch-fleet-and-wait) requires the
                   # calling job to have checked out the repo first, so the
                   # action's own definition exists in the workspace.
  actions: write   # gh workflow run <fleet> --ref <tag>; gh run list / gh run view

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # DECISION POINT (STATBUS-246). Every joint below runs this as the
  # ARRIVING job's first act — never as a dying job's last duty. A job that
  # is being cancelled or has crashed does nothing at all, so a stopping
  # mechanism that depends on the departing job has no authority over the
  # only case that matters. A check that runs only when things are going
  # well is not a check.
  #
  # It answers ONE question here (OBSOLETE?) and each scenario joint answers
  # the second (COVERED?) for itself, because coverage is per-scenario while
  # obsolescence is a property of the whole chain.
  #
  # GRACEFUL, NOT IMMEDIATE: an obsolete chain starts nothing further, and
  # whatever is already running finishes and tears down its own machines by
  # its own path. Killing in-flight work would strand exactly the young VMs
  # the age-gated sweep is built not to touch — the failure mode this design
  # dissolves rather than handles. The finish-out cost is RATIFIED: we had
  # already committed that money when the work started, and what it buys is
  # complete evidence plus guaranteed self-teardown.
  # ═══════════════════════════════════════════════════════════════════════
  decide-obsolete:
    name: "Decision point: is this candidate still the newest?"
    # No needs — pure git work, no VM cost, so its verdict is known long
    # before the first joint that consults it.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      obsolete: ${{ steps.check.outputs.obsolete }}
      newer: ${{ steps.check.outputs.newer }}
    steps:
      - name: Checkout (full history + tags — need every RC tag to compare)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is a newer candidate already cut?
        id: check
        run: |
          set -euo pipefail
          THIS_TAG="${{ github.ref_name }}"
          # Newest-first. If THIS tag is not line 1, something newer exists.
          NEWEST="$(git tag --sort=-version:refname | grep -- '-rc\.' | sed -n '1p' || true)"
          echo "This candidate: $THIS_TAG"
          echo "Newest candidate visible: ${NEWEST:-<none>}"
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "$THIS_TAG" ]; then
            echo "OBSOLETE: $NEWEST supersedes $THIS_TAG."
            echo "Nothing further will START. Work already running finishes and tears down its own machines."
            echo "obsolete=true" >> "$GITHUB_OUTPUT"
            echo "newer=$NEWEST" >> "$GITHUB_OUTPUT"
          else
            echo "$THIS_TAG is still the newest candidate — the chain proceeds."
            echo "obsolete=false" >> "$GITHUB_OUTPUT"
            echo "newer=" >> "$GITHUB_OUTPUT"
          fi

  smoke-install:
    name: "1/5 smoke: fresh install (0-happy-install)"
    needs: [decide-obsolete]
    # The decision point gates the joint. !cancelled() for the STATBUS-215
    # reason applied throughout this file: an explicit if: that never calls a
    # status function is implicitly ANDed with success(), which would skip
    # this job on any non-success upstream result — the exact silent-skip
    # this condition exists to prevent.
    if: >-
      ${{ !cancelled() &&
          needs['decide-obsolete'].result == 'success' &&
          needs['decide-obsolete'].outputs.obsolete == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      run_url: ${{ steps.dispatch.outputs.run-url }}
      covered: ${{ steps.covered.outputs.covered }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The covered() decision runs the SAME library as the promotion gate,
      # so the chain and the gate cannot drift into two answers (STATBUS-249,
      # the King's "same by design, not by chance"). That means this job needs
      # the binary, built from THIS commit's source.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          # STATBUS-235: go.mod/go.sum live in cli/, not the repo root.
          cache-dependency-path: cli/go.sum

      - name: Build sb (the coverage decision runs the gate's own library)
        # No args = host platform, written to ./sb — the daily-driver path.
        # (NOT `build-sb linux/amd64`, which writes sb-linux-amd64 for upload
        # to a VM; this binary runs here on the runner.)
        run: ./dev.sh build-sb

      - name: "Decision point: is 0-happy-install already covered at this commit?"
        id: covered
        env:
          # BOTH names, deliberately. `./sb release covered` reads the
          # GITHUB_TOKEN env var DIRECTLY (githubAuthHeader,
          # cli/internal/release/check.go:335-340) — it does NOT use the gh
          # CLI's stored credential. Setting only GH_TOKEN leaves the library
          # unauthenticated, every API call 403s, and the decision degrades to
          # exit 2 "undecidable" — which runs the scenario, so the chain still
          # goes green while the skip silently never works. Observed as real
          # 403s during the library's own live testing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # ONE algorithm, two call sites (STATBUS-249): this is the same
          # library the promotion gate uses, invoked as a subcommand so the
          # chain and the gate can never drift into two answers.
          #   0 = covered (skip)   1 = must run   2 = could not decide
          # UNDECIDABLE IS NOT AN ANSWER. It renders as must-run — the safe
          # direction, since over-running costs money and under-running costs
          # a proof — but it says so, because a chain that silently treats
          # "could not tell" as "must run" hides an API outage as diligence.
          set +e
          OUT="$(./sb release covered 0-happy-install "${{ github.sha }}" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          case "$RC" in
            0) echo "covered=true"  >> "$GITHUB_OUTPUT"
               # AC#5/#6: a skip NAMES its source, durably, on the run itself —
               # never a bare skip. The subcommand's own sentence is the record.
               { echo "- **0-happy-install**: SKIPPED — already covered."; printf '  > %s\n' "$OUT"; } >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "covered=false" >> "$GITHUB_OUTPUT"
               echo "- **0-happy-install**: RUNNING — not covered at this code-state." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::warning title=Coverage undecidable::could not decide whether 0-happy-install is covered (exit $RC) — running it. This is a failure to decide, not a decision."
               echo "covered=false" >> "$GITHUB_OUTPUT"
               echo "- **0-happy-install**: RUNNING — coverage was UNDECIDABLE (exit $RC), which is a failure to decide, not a decision." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Dispatch test-install.yaml at the tag and wait for its conclusion
        id: dispatch
        if: steps.covered.outputs.covered != 'true'
        uses: ./.github/actions/dispatch-fleet-and-wait
        with:
          workflow-file: test-install.yaml
          ref: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          poll-budget-s: "2700"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  smoke-upgrade:
    name: "2/5 smoke: install-then-upgrade (0-happy-upgrade)"
    needs: [decide-obsolete]
    # Runs in PARALLEL with smoke-install: both are cheap, ephemeral and
    # independent, and dev must not be touched until BOTH have passed.
    #
    # TWO PATHS, NOT ONE, and this is the one that would be trimmed for time:
    # dev is UPGRADED rather than installed, so a candidate that installs
    # cleanly but cannot be upgraded onto would sail through a single-path
    # smoke and fail at the first stage that costs us something we care about.
    if: >-
      ${{ !cancelled() &&
          needs['decide-obsolete'].result == 'success' &&
          needs['decide-obsolete'].outputs.obsolete == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      run_url: ${{ steps.dispatch.outputs.run-url }}
      covered: ${{ steps.covered.outputs.covered }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The covered() decision runs the SAME library as the promotion gate,
      # so the chain and the gate cannot drift into two answers (STATBUS-249,
      # the King's "same by design, not by chance"). That means this job needs
      # the binary, built from THIS commit's source.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          # STATBUS-235: go.mod/go.sum live in cli/, not the repo root.
          cache-dependency-path: cli/go.sum

      - name: Build sb (the coverage decision runs the gate's own library)
        # No args = host platform, written to ./sb — the daily-driver path.
        # (NOT `build-sb linux/amd64`, which writes sb-linux-amd64 for upload
        # to a VM; this binary runs here on the runner.)
        run: ./dev.sh build-sb

      - name: "Decision point: is 0-happy-upgrade already covered at this commit?"
        id: covered
        env:
          # BOTH names, deliberately. `./sb release covered` reads the
          # GITHUB_TOKEN env var DIRECTLY (githubAuthHeader,
          # cli/internal/release/check.go:335-340) — it does NOT use the gh
          # CLI's stored credential. Setting only GH_TOKEN leaves the library
          # unauthenticated, every API call 403s, and the decision degrades to
          # exit 2 "undecidable" — which runs the scenario, so the chain still
          # goes green while the skip silently never works. Observed as real
          # 403s during the library's own live testing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          OUT="$(./sb release covered 0-happy-upgrade "${{ github.sha }}" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          case "$RC" in
            0) echo "covered=true"  >> "$GITHUB_OUTPUT"
               # AC#5/#6: a skip NAMES its source, durably, on the run itself —
               # never a bare skip. The subcommand's own sentence is the record.
               { echo "- **0-happy-upgrade**: SKIPPED — already covered."; printf '  > %s\n' "$OUT"; } >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "covered=false" >> "$GITHUB_OUTPUT"
               echo "- **0-happy-upgrade**: RUNNING — not covered at this code-state." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::warning title=Coverage undecidable::could not decide whether 0-happy-upgrade is covered (exit $RC) — running it. This is a failure to decide, not a decision."
               echo "covered=false" >> "$GITHUB_OUTPUT"
               echo "- **0-happy-upgrade**: RUNNING — coverage was UNDECIDABLE (exit $RC), which is a failure to decide, not a decision." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Dispatch test-upgrade.yaml at the tag and wait for its conclusion
        id: dispatch
        if: steps.covered.outputs.covered != 'true'
        uses: ./.github/actions/dispatch-fleet-and-wait
        with:
          workflow-file: test-upgrade.yaml
          ref: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          poll-budget-s: "2700"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  dev-canary:
    name: "3/5: dev takes the candidate (the automatic canary)"
    needs: [decide-obsolete, smoke-install, smoke-upgrade]
    # BOTH smoke paths must have passed. dev is the first thing in this chain
    # that is NOT disposable — everything before it runs on rented machines we
    # throw away, and everything after it is expensive. That single asymmetry
    # sets the whole order: disposable things filter for the irreplaceable
    # one, and the irreplaceable one filters for the expensive ones.
    #
    # A COVERED smoke job is a PASS for this purpose: its result is 'success'
    # either way, because being already proven at this code-state and having
    # just been proven are the same fact about the candidate.
    if: >-
      ${{ !cancelled() &&
          needs['decide-obsolete'].result == 'success' &&
          needs['decide-obsolete'].outputs.obsolete == 'false' &&
          needs['smoke-install'].result == 'success' &&
          needs['smoke-upgrade'].result == 'success' }}
    runs-on: ubuntu-24.04
    # deploy-to-dev's own convergence poll is the long pole; budget above it.
    timeout-minutes: 90
    permissions:
      contents: write   # write the deploy branch AT THE TAGGED COMMIT
      actions: write    # observe the deploy workflow's run
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - name: Checkout (full history — the deploy branch is written at this tag's commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DECISION POINT, re-asked by THIS job as its own first act
      # (STATBUS-246 AC#1). Not a re-read of an earlier verdict: a newer
      # candidate may have been cut while the previous stage was running, and
      # the whole principle is that the ARRIVING job decides. A single upfront
      # check would answer a question that was asked before this joint existed.
      - name: "Decision point: still the newest candidate?"
        id: obsolete
        run: |
          set -euo pipefail
          git fetch --tags --quiet origin || true
          THIS_TAG="${{ github.ref_name }}"
          NEWEST="$(git tag --sort=-version:refname | grep -- '-rc\.' | sed -n '1p' || true)"
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "$THIS_TAG" ]; then
            echo "::notice title=Superseded::$NEWEST supersedes $THIS_TAG — this joint starts nothing further. Work already running finishes and tears down its own machines."
            echo "obsolete=true" >> "$GITHUB_OUTPUT"
            echo "- **${{ github.job }}**: STOPPED — superseded by \`$NEWEST\`; nothing further started here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$THIS_TAG is still the newest candidate — proceeding."
            echo "obsolete=false" >> "$GITHUB_OUTPUT"
            echo "- **${{ github.job }}**: proceeding — \`$THIS_TAG\` is still the newest candidate." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Point dev's deploy branch at THIS CANDIDATE's commit
        id: deploy
        if: steps.obsolete.outputs.obsolete != 'true'
        run: |
          set -euo pipefail
          # STATBUS-247: the transport is unchanged — a push to the deploy
          # branch pokes the box's upgrade service, which converges and is
          # addressed BY COMMIT. What changes is WHAT the branch points at:
          # the tagged candidate, never master's tip. That is the whole of
          # "tagging a candidate installs it on dev with no human action".
          #
          # AUTOMATION WRITES THIS BRANCH, NEVER A PERSON. The human-facing
          # buttons that used to write deploy branches with master's tip are
          # gone (STATBUS-244a); this is the one remaining writer, and it is
          # addressed at a tag.
          #
          # WHY DEV IS TAG-DRIVEN AND NORWAY IS NOT: the chain needs a
          # SYNCHRONOUS verdict — it must know NOW whether a real box took
          # the candidate. Discovery ticks on a long interval and only OFFERS,
          # so there would be nothing to wait on. Norway is deliberately the
          # opposite: offered and human-installed, with an open-ended wait.
          echo "Pointing ops/cloud/deploy/dev at ${{ github.sha }} (tag ${{ github.ref_name }})"
          git push --force origin "${{ github.sha }}:refs/heads/ops/cloud/deploy/dev"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for dev to converge on the candidate
        if: steps.obsolete.outputs.obsolete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The branch push above IS the trigger — deploy-to-dev.yaml fires on a
        # push to its branch — so this step OBSERVES that run rather than
        # starting one.
        #
        # It deliberately does NOT use ./.github/actions/dispatch-fleet-and-wait:
        # that action dispatches a workflow_dispatch run and correlates by
        # `--event=workflow_dispatch`. Used here it would start a SECOND deploy
        # alongside the push-triggered one and then watch the wrong run. Caught
        # by checking the action's correlation filter against this workflow's
        # actual trigger rather than assuming they matched.
        #
        # Polls `gh run list` and branches on the conclusion explicitly — never
        # `gh run watch --exit-status`, which has returned 0 for a FAILED run in
        # this org's own deploy history (CLAUDE.md).
        run: |
          set -euo pipefail
          BUDGET=4800   # 80min, under this job's 90min ceiling
          WAITED=0
          INTERVAL=20
          while [ "$WAITED" -lt "$BUDGET" ]; do
            LINE="$(gh run list --workflow=deploy-to-dev.yaml \
                      --commit="${{ github.sha }}" --limit 1 \
                      --json status,conclusion,url \
                      --jq '.[0] | "\(.status)|\(.conclusion)|\(.url)"' 2>/dev/null || true)"
            STATUS="${LINE%%|*}"; REST="${LINE#*|}"; CONCL="${REST%%|*}"; URL="${REST#*|}"
            if [ -z "$LINE" ] || [ "$LINE" = "null|null|null" ]; then
              echo "  waiting for deploy-to-dev to appear at ${{ github.sha }} (${WAITED}s/${BUDGET}s)"
            elif [ "$STATUS" != "completed" ]; then
              echo "  deploy-to-dev $STATUS (${WAITED}s/${BUDGET}s) — $URL"
            elif [ "$CONCL" = "success" ]; then
              echo "✓ dev converged on ${{ github.ref_name }} — $URL"
              exit 0
            else
              echo "✗ dev did NOT take this candidate (conclusion: $CONCL)"
              echo "   Run: $URL"
              echo "   The chain stops here BY DESIGN: dev's failure must stop it"
              echo "   before any expensive fleet is dispatched. Read that run, and"
              echo "   the box's own upgrade log, before re-cutting."
              exit 1
            fi
            sleep "$INTERVAL"
            WAITED=$((WAITED + INTERVAL))
          done
          echo "✗ dev did not converge within ${BUDGET}s — treating as a failure, not as a pass."
          echo "   A convergence wait that times out into success would defeat the"
          echo "   entire point of gating the fleets on a real box."
          exit 1

  install-recovery-harness:
    name: "4/5: dispatch Install Recovery Harness"
    needs: [decide-obsolete, dev-canary]
    # dev's failure stops the chain BEFORE any expensive fleet is dispatched
    # (STATBUS-247 AC#4), and the decision point is re-asked here because a
    # newer candidate may have been cut while dev was converging — the
    # arriving job asks for itself — see the decision-point step below.
    if: >-
      ${{ !cancelled() &&
          needs['decide-obsolete'].result == 'success' &&
          needs['decide-obsolete'].outputs.obsolete == 'false' &&
          needs['dev-canary'].result == 'success' }}
    runs-on: ubuntu-24.04
    # install-recovery-harness.yaml's own stages: discover(50) +
    # run-scenario(120/job, max-parallel 3, ~28 scenarios -> comfortably
    # under GitHub's hard 360min job ceiling per its own header comment,
    # typical wall-clock ~60-80min) + cleanup(10). Budget generously above
    # the typical case without approaching the 360min per-job ceiling
    # (this is a SEPARATE job from upgrade-arc-harness's below, so it gets
    # its own fresh 360min allowance).
    timeout-minutes: 180
    outputs:
      run_url: ${{ steps.dispatch.outputs.run-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # DECISION POINT, re-asked by THIS job as its own first act
      # (STATBUS-246 AC#1). Not a re-read of an earlier verdict: a newer
      # candidate may have been cut while the previous stage was running, and
      # the whole principle is that the ARRIVING job decides. A single upfront
      # check would answer a question that was asked before this joint existed.
      - name: "Decision point: still the newest candidate?"
        id: obsolete
        run: |
          set -euo pipefail
          git fetch --tags --quiet origin || true
          THIS_TAG="${{ github.ref_name }}"
          NEWEST="$(git tag --sort=-version:refname | grep -- '-rc\.' | sed -n '1p' || true)"
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "$THIS_TAG" ]; then
            echo "::notice title=Superseded::$NEWEST supersedes $THIS_TAG — this joint starts nothing further. Work already running finishes and tears down its own machines."
            echo "obsolete=true" >> "$GITHUB_OUTPUT"
            echo "- **${{ github.job }}**: STOPPED — superseded by \`$NEWEST\`; nothing further started here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$THIS_TAG is still the newest candidate — proceeding."
            echo "obsolete=false" >> "$GITHUB_OUTPUT"
            echo "- **${{ github.job }}**: proceeding — \`$THIS_TAG\` is still the newest candidate." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dispatch install-recovery-harness.yaml at the tag and wait for its conclusion
        id: dispatch
        if: steps.obsolete.outputs.obsolete != 'true'
        uses: ./.github/actions/dispatch-fleet-and-wait
        with:
          workflow-file: install-recovery-harness.yaml
          ref: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          poll-budget-s: "9600"   # ~160min
          github-token: ${{ secrets.GITHUB_TOKEN }}

  decide-upgrade-sensitivity:
    name: "Decide: is this RC upgrade-sensitive? (skip-eligibility for the arc fleet only)"
    # No needs — this is pure git/grep work with no VM cost, so it runs
    # from the start in parallel with test-install rather than waiting on
    # anything. By the time install-recovery-harness finishes (the fleet
    # upgrade-arc-harness's own dispatch decision waits on), this job's
    # verdict has been known for a long time.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read   # checkout only — this job never dispatches or lists runs
    outputs:
      sensitive: ${{ steps.check.outputs.sensitive }}
    steps:
      - name: Checkout (full history + tags — need the previous RC tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against the previous RC tag vs the sensitivity list
        id: check
        # STATBUS-223: the SAME derivation upgrade-arc-harness.yaml's now-
        # deleted `decide` job used to run, relocated here — see this
        # workflow's top-of-file "UPGRADE-SENSITIVITY GATE" comment for
        # why. PREV_TAG derivation mirrors release.yaml's existing
        # migration-detection step (git tag --sort=-version:refname |
        # sed -n '2p' — line 1 is the tag that triggered this run), narrowed
        # to RC tags. Matching is substring containment, same rule
        # ops/release/upgrade-sensitive-paths.txt documents for the Go-side
        # gate (deliberately over-inclusive) — this decision is a COST
        # OPTIMIZER ONLY: the stable release gate
        # (checkUpgradeArcHarnessGate, cli/cmd/release.go) computes its own
        # diff independently and never trusts this job's verdict; a wrong
        # answer here only costs an avoidable/skipped fleet dispatch, never
        # a bad promotion.
        run: |
          set -euo pipefail
          PREV_RC="$(git tag --sort=-version:refname | grep -- '-rc\.' | sed -n '2p')"
          if [ -z "$PREV_RC" ]; then
            echo "No previous RC tag found (first-ever RC, or not yet visible via this checkout) — treating as sensitive."
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Previous RC tag: $PREV_RC"
          echo "Sensitive paths (ops/release/upgrade-sensitive-paths.txt):"
          grep -v '^#' ops/release/upgrade-sensitive-paths.txt | grep -v '^[[:space:]]*$' | sed 's/^/  /'
          CHANGED="$(git diff --name-only "$PREV_RC"..HEAD)"
          echo "Changed files since $PREV_RC:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          PATTERNS="$(grep -v '^#' ops/release/upgrade-sensitive-paths.txt | grep -v '^[[:space:]]*$')"
          if printf '%s\n' "$CHANGED" | grep -F -f <(printf '%s\n' "$PATTERNS") -q; then
            echo "Sensitive change detected since $PREV_RC — the upgrade arc fleet WILL be dispatched."
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "No upgrade-sensitive changes since $PREV_RC — the upgrade arc fleet will be SKIPPED (STATBUS-223). test-install and install-recovery-harness still run regardless. The stable release gate independently re-verifies this before ever promoting."
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
            # HONESTY LINE (architect's ruling on STATBUS-246 C1). Every other
            # skip in this chain is backed by EVIDENCE — a mark proving the work
            # ran at this code-state. This one is not: it compares against the
            # previous TAG and assumes that predecessor was proven. A tag is a
            # name, and a name says nothing about whether anything ran; that
            # assumption is exactly the rc.07 defect STATBUS-249 was filed
            # against. It survives here as a cost optimizer only, and the chain
            # must not have one silent exception to its own honesty.
            {
              echo "- **upgrade-arc fleet**: SKIPPED on a TAG-DIFF ASSUMPTION, *not* on evidence."
              echo "  > Assumed predecessor: \`$PREV_RC\` — assumed proven because it is the previous RC tag, NOT because a mark says so."
              echo "  > Successor mechanism: STATBUS-252 replaces this with the per-scenario evidence path (\`./sb release covered\`), which cannot inherit from something never proven."
              echo "  > The stable release gate re-derives this independently and never trusts this line."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  upgrade-arc-harness:
    name: "5/5 (most expensive): dispatch Upgrade Arc Harness"
    needs: [decide-obsolete, install-recovery-harness, decide-upgrade-sensitivity]
    # STATBUS-223: only the arc fleet is skip-eligible — test-install and
    # install-recovery-harness (above) always run unconditionally. Skip
    # ONLY when decide-upgrade-sensitivity explicitly CONFIRMED
    # non-sensitive (result=='success' AND sensitive=='false'); any other
    # state — the job failed, was cancelled, or its output is merely
    # absent — falls through to RUNNING the fleet. RIDE is a cost
    # optimizer only and must never be the reason proof goes silently
    # missing; the stable release gate re-derives this decision itself
    # regardless (cli/cmd/release.go) and is the only authority that can
    # ever let something ship unproven. !cancelled() is required here for
    # the same STATBUS-215 reason it is on every other explicit if: in
    # this file: an explicit condition that never references a
    # status-check function gets implicitly ANDed with success() by
    # GitHub, which would silently skip this job if
    # decide-upgrade-sensitivity's result were ever anything but success —
    # exactly the failure mode this if: exists to prevent.
    if: >-
      ${{ !cancelled() &&
          needs['decide-obsolete'].result == 'success' &&
          needs['decide-obsolete'].outputs.obsolete == 'false' &&
          needs['install-recovery-harness'].result == 'success' &&
          !(needs['decide-upgrade-sensitivity'].result == 'success' && needs['decide-upgrade-sensitivity'].outputs.sensitive == 'false') }}
    runs-on: ubuntu-24.04
    # upgrade-arc-harness.yaml's own stages: construct(15) + image-wait(50)
    # + run-arc(120/job, max-parallel 3, 31 arcs -> up to 11 waves) +
    # teardown(10) + cleanup(10) -> worst case comfortably under the 360min
    # per-job ceiling but the longest of the three fleets; budgeted with
    # the most headroom accordingly.
    timeout-minutes: 330
    outputs:
      run_url: ${{ steps.dispatch.outputs.run-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # DECISION POINT, re-asked by THIS job as its own first act
      # (STATBUS-246 AC#1). Not a re-read of an earlier verdict: a newer
      # candidate may have been cut while the previous stage was running, and
      # the whole principle is that the ARRIVING job decides. A single upfront
      # check would answer a question that was asked before this joint existed.
      - name: "Decision point: still the newest candidate?"
        id: obsolete
        run: |
          set -euo pipefail
          git fetch --tags --quiet origin || true
          THIS_TAG="${{ github.ref_name }}"
          NEWEST="$(git tag --sort=-version:refname | grep -- '-rc\.' | sed -n '1p' || true)"
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "$THIS_TAG" ]; then
            echo "::notice title=Superseded::$NEWEST supersedes $THIS_TAG — this joint starts nothing further. Work already running finishes and tears down its own machines."
            echo "obsolete=true" >> "$GITHUB_OUTPUT"
            echo "- **${{ github.job }}**: STOPPED — superseded by \`$NEWEST\`; nothing further started here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$THIS_TAG is still the newest candidate — proceeding."
            echo "obsolete=false" >> "$GITHUB_OUTPUT"
            echo "- **${{ github.job }}**: proceeding — \`$THIS_TAG\` is still the newest candidate." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dispatch upgrade-arc-harness.yaml at the tag and wait for its conclusion
        id: dispatch
        if: steps.obsolete.outputs.obsolete != 'true'
        uses: ./.github/actions/dispatch-fleet-and-wait
        with:
          workflow-file: upgrade-arc-harness.yaml
          ref: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          poll-budget-s: "19200"   # ~320min, under the 330min job ceiling above
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # THE THIRD VERDICT (STATBUS-246 AC#4). A chain stopped by supersession is
  # neither red nor green, and both approximations do real harm: a RED
  # superseded chain trains people to ignore red, and a GREEN one is a
  # promotable signal for a candidate that was never fully tested.
  #
  # It is a NAMED outcome, not an approximation via success()/failure().
  # This job runs only when the chain was superseded, and it SUCCEEDS —
  # because nothing failed — while stating in its own name and output that
  # nothing may be promoted on it. Read the name, not the colour.
  # ═══════════════════════════════════════════════════════════════════════
  superseded:
    name: "SUPERSEDED — stopped for a newer candidate; nothing failed, nothing may be promoted"
    # RUNS LAST, and ASKS FOR ITSELF. Both properties are the fix for a real
    # defect in the first version of this file, and it was the COMMON path:
    #
    # this job used to key on decide-obsolete's UPFRONT answer alone. A chain
    # runs for hours; a newer candidate gets cut mid-chain; each later joint's
    # own inline check correctly declines to start anything — and every one of
    # those jobs then SUCCEEDS having done nothing, while this verdict never
    # fires because the upfront answer was 'false'. The run concludes SUCCESS
    # with no fleet having run and nothing saying why: the rc.07 defect reborn
    # inside the mechanism built to prevent it.
    #
    # So it needs: every joint (to run last) and performs the obsolete check as
    # its OWN first act — the arriving job checks for itself rather than
    # trusting five predecessors to have reported, which is this file's whole
    # principle applied to the job that states the verdict.
    needs:
      - decide-obsolete
      - smoke-install
      - smoke-upgrade
      - dev-canary
      - install-recovery-harness
      - upgrade-arc-harness
    # !cancelled() rather than success(): every upstream may legitimately be
    # SKIPPED on a superseded chain, and this job must still speak.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (full history + tags — the check is this job's own)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Decision point: was this candidate superseded at any time during the chain?"
        id: obsolete
        run: |
          set -euo pipefail
          git fetch --tags --quiet origin || true
          THIS_TAG="${{ github.ref_name }}"
          NEWEST="$(git tag --sort=-version:refname | grep -- '-rc\.' | sed -n '1p' || true)"
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "$THIS_TAG" ]; then
            echo "obsolete=true" >> "$GITHUB_OUTPUT"
            echo "newer=$NEWEST" >> "$GITHUB_OUTPUT"
          else
            echo "obsolete=false" >> "$GITHUB_OUTPUT"
            echo "newer=" >> "$GITHUB_OUTPUT"
            echo "$THIS_TAG was never superseded — no verdict to state."
          fi

      - name: State the verdict
        if: steps.obsolete.outputs.obsolete == 'true'
        env:
          NEWER: ${{ steps.obsolete.outputs.newer }}
        run: |
          set -euo pipefail
          NEWER="${NEWER:-}"
          echo "════════════════════════════════════════════════════════════"
          echo "VERDICT: SUPERSEDED"
          echo "  This candidate: ${{ github.ref_name }}"
          echo "  Superseded by:  ${NEWER:-a newer candidate}"
          echo
          echo "NOTHING FAILED. No one should triage this run."
          echo "NOTHING MAY BE PROMOTED ON IT: this candidate's chain stopped"
          echo "before completing, so it carries no proof."
          echo
          echo "Work that was ALREADY RUNNING when this was decided finishes"
          echo "normally and tears down its own machines by its own path —"
          echo "that is deliberate. Killing it mid-flight would strand exactly"
          echo "the young machines the age-gated sweep is built not to touch."
          echo
          echo "Your next move: follow ${NEWER:-the newer candidate}'s own chain."
          echo "════════════════════════════════════════════════════════════"
          echo "### SUPERSEDED — stopped for ${NEWER:-a newer candidate}" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing failed; nothing may be promoted on this run." >> "$GITHUB_STEP_SUMMARY"
