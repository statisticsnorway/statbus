# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test Install

# Test Install — RC-time end-to-end install gate via Hetzner Cloud VM.
#
# Triggered by release-fleet-orchestrator.yaml at prerelease tag push
# (`v*-rc.*`, STATBUS-214 — this workflow no longer carries that trigger
# itself, see the STATBUS-214 comment on the `on:` block below) or by
# manual dispatch. Provisions a fresh Hetzner CX23 in hel1, runs scenario 0-happy-install of the
# install-recovery harness (bootstrap → ./sb install → assert health +
# step 9 + step 15 + systemd active), then deletes the VM. The harness
# scenario lives at test/install-recovery/scenarios/0-happy-install.sh.
#
# Why a real VM and not the GHA runner: the install path's failure modes
# mostly live BEFORE the runner's preconfigured state would expose them —
# Stage 7 service-account creation, fresh-machine sudoers, initial
# systemd-user-linger. test-hardening.yaml covers `./sb install` itself on
# the runner (no Stage 0-6); this workflow covers the
# everything-before-./sb-install bootstrap on a clean Ubuntu 24.04 VM.
#
# Cost: one CX23 in hel1 + primary IPv4 = €0.0072/hr, billed at the
# 1-hour Hetzner minimum, so ~€0.0072 per run. Typical wall-clock
# 12-15 min; 35-min timeout budgets in provisioning latency and cleanup.
#
# Relationship to other CI workflows:
#   - `images.yaml` — builds Docker images and the `sb` binary
#     artifacts on master push.
#   - `test-hardening.yaml` — cheap in-runner subset (setup.sh Stage 7,
#     `./sb install` against the runner's docker, install.sh bootstrap).
#   - `test-install.yaml` — THIS workflow, the outboard end-to-end gate
#     fired by `./sb release stable` pre-flight via
#     `release.CheckWorkflowAtCommit(WorkflowTestInstall, sha)`.
#
# See doc/release-workflow-gates.md for the full gate-pattern reference,
# the any-green semantics, and the `SKIP_TEST_INSTALL=1` operator bypass.

# STATBUS-214: the v*-rc.* tag-push trigger moved OFF this workflow onto
# .github/workflows/release-fleet-orchestrator.yaml, which now owns the tag
# and dispatches this workflow (cheapest-first of the three) via
# `gh workflow run --ref <tag>` once a needs: chain, not a shared
# concurrency group, is what makes the three fleets run in a deterministic
# order with zero cancellation surface — a concurrency group only keeps one
# running + one pending run, so the third of three tag-fired fleets was
# getting silently cancelled (see the orchestrator's own header comment for
# the full history). workflow_dispatch stays for manual/subset runs; a
# dispatch from the orchestrator is indistinguishable from a human's here
# except by actor.
on:
  workflow_dispatch:

# Don't cancel a run that's already provisioned a VM — cancellation skips
# the scenario's cleanup trap and would orphan a Hetzner instance (and bill
# the next hour). Queue subsequent triggers behind the live one instead.
#
# STATBUS-208 (kept as defense in depth after STATBUS-214): the group is
# SHARED (hetzner-vm-fleet) across all three VM-fleet workflows (this one,
# install-recovery-harness.yaml, upgrade-arc-harness.yaml). It no longer
# does the tag-push serialization job — the release-fleet-orchestrator's
# needs: chain does that now, dispatching the three fleets strictly one at
# a time — but it still stops a stray manual workflow_dispatch of one fleet
# from running concurrently with the orchestrator's own sequential
# dispatch of another, which would recreate the same VM-capacity collision
# (defect B) this group was built to prevent. vm-bootstrap.sh's run-scoped
# VM naming (defect A) is what actually stops this workflow's VM name
# (statbus-recovery-0-happy-install) from colliding with
# install-recovery-harness.yaml's own 0-happy-install scenario — this
# concurrency group is a capacity fix, not a naming fix.
concurrency:
  group: hetzner-vm-fleet
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  hetzner-vm-install:
    name: Provision Hetzner VM + run scenario 0-happy-install
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        # fetch-depth: 1 — scenario 0-happy-install references local HEAD only. The tag
        # ref itself is at HEAD on a tag-trigger run, so `git describe
        # --tags` in dev.sh build-sb's ldflag-stamping path still resolves
        # to the exact tag without needing deeper history.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        # go-version-file pins to cli/go.mod's `go` directive — single
        # source of truth, mirrors the existing pattern in
        # test-hardening.yaml and release.yaml's build-binaries job.
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          # STATBUS-235: go.mod/go.sum live in cli/, not the repo root —
          # without this, setup-go's cache lookup silently never found
          # go.sum, so GOCACHE was never restored (STATBUS-234 comment #1).
          # This job never runs `go test`, only `go build` (via
          # dev.sh build-sb) — Go's build cache is correctly keyed on
          # source content with no outside-module blind spot, so caching
          # it here carries none of STATBUS-234's staleness risk.
          # If you ever ADD a `go test` step to this job, it must carry
          # -count=1 (STATBUS-234) — that rule, not this job's current
          # contents, is what keeps the cache safe.
          cache-dependency-path: cli/go.sum

      - name: Build sb binary (linux/amd64)
        # `./dev.sh build-sb linux/amd64` writes `sb-linux-amd64` to the
        # repo root and stamps the LDFLAGS version + 40-char commit so
        # the binary's --version output matches the tag. We use the same
        # primitive as the release workflow rather than a hand-rolled
        # `go build`, so any future change to the build recipe propagates
        # here automatically.
        run: ./dev.sh build-sb linux/amd64

      - name: Install hcloud CLI
        # Pinned binary from GitHub releases. Hetzner does NOT operate a
        # signed apt repo for the hcloud CLI itself (packages.hetzner.com/hcloud/deb
        # serves hc-utils only — verified 2026-05-20), so the canonical
        # install on Linux is the GitHub release tarball. Pin the version
        # so a runner upgrade doesn't change observed behaviour.
        env:
          HCLOUD_CLI_VERSION: "1.64.1"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/hetznercloud/cli/releases/download/v${HCLOUD_CLI_VERSION}/hcloud-linux-amd64.tar.gz" \
            -o /tmp/hcloud.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/hcloud.tar.gz hcloud
          rm /tmp/hcloud.tar.gz
          hcloud version

      - name: Install CI SSH private key
        # The matching public key is registered in the Hetzner project as
        # SSH key "statbus-ci" — vm-bootstrap.sh references it by name via
        # the HCLOUD_SSH_KEY env (set in the next step's env block). The
        # private key here is what the runner uses to SSH into the
        # provisioned VM after Hetzner injects the public key at boot.
        env:
          STATBUS_CI_SSH_PRIVATE_KEY: ${{ secrets.STATBUS_CI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STATBUS_CI_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Confirm the key parses without echoing any material to the log.
          # ssh-keygen -lf prints `<bits> <fingerprint> <comment> (<type>)`.
          ssh-keygen -lf ~/.ssh/id_ed25519 \
            | awk '{ print "SSH key fingerprint:", $2 }'

      - name: Run scenario 0-happy-install on Hetzner VM
        # `./dev.sh test-install` delegates to scenario 0-happy-install, which uses
        # vm-bootstrap.sh's bootstrap_install_test_vm + install_statbus_in_vm
        # primitives. STATBUS_SB_BINARY tells vm-bootstrap.sh to use the
        # CI-built binary (above) instead of rebuilding `sb` inside the
        # harness — saves ~30s and pins the test to exactly the artifact
        # the tag commit produces.
        #
        # HCLOUD_SSH_KEY=statbus-ci selects the key the VM is provisioned
        # with; pairs with the private key written above so the runner can
        # immediately SSH in once cloud-init finishes.
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_SSH_KEY: statbus-ci
          STATBUS_SB_BINARY: ${{ github.workspace }}/sb-linux-amd64
        run: ./dev.sh test-install

      - name: Cat install log on failure
        # When test-install fails (e.g. an assertion mismatch), the
        # operator-visible workflow log says "step X status unclear" but
        # the actual install log on the runner is buried. Echo it to
        # workflow stdout so the failure cause is immediately visible
        # without having to fetch the artifact. Belt-and-suspenders with
        # the upload-artifact step below.
        if: failure()
        run: |
          for log in tmp/install-recovery-*-install.log; do
            [ -e "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Upload install log on failure
        # Preserves the install log past the workflow run so operators
        # can download + analyze it days later. Default retention is
        # 90 days, which is plenty for post-mortems on CI failures.
        # Only runs on failure to avoid the storage cost on green runs.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-recovery-log-${{ github.run_id }}
          path: tmp/install-recovery-*-install.log
          retention-days: 30
          if-no-files-found: warn

      - name: Reap orphan VMs (defense in depth)
        # Scenario 01's `trap cleanup_vm "$VM_NAME" EXIT` normally deletes
        # the VM on every exit path. This step is the safety net for the
        # cases where the trap doesn't fire: GHA-side cancellation
        # (manual cancel, timeout-minutes, runner-fault), SIGKILL of the
        # harness process by the runner host, or a bug that exits before
        # the trap is installed. Without this, a leftover statbus-recovery-*
        # VM accrues €0.0072/hr until someone notices.
        #
        # STATBUS-208: this workflow provisions exactly ONE VM per run, and
        # vm-bootstrap.sh's run-scoped naming (defect A) makes that VM's
        # exact name deterministically computable from GITHUB_RUN_ID — so
        # this step now targets that EXACT name instead of a broad
        # `statbus-recovery-*` prefix sweep. A prefix sweep here would have
        # the same cross-run blast radius the original defect A bug
        # exploited: it can't tell "my own orphan" from "another run's
        # live VM that happens to share the prefix" (e.g.
        # install-recovery-harness.yaml's own scenario VMs). The suffix
        # formula MUST match vm-bootstrap.sh's _run_suffix() exactly —
        # last 8 chars of GITHUB_RUN_ID — or this step reaps nothing.
        #
        # Best-effort: any failure here doesn't fail the workflow (the
        # main test step already determined pass/fail). Operators can
        # inspect leftovers via `hcloud server list` from a workstation.
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if ! command -v hcloud >/dev/null 2>&1; then
            echo "hcloud CLI not installed (earlier step likely failed) — skipping reap"
            exit 0
          fi
          run_suffix="${GITHUB_RUN_ID: -8}"
          vm="statbus-recovery-0-happy-install-${run_suffix}"
          if hcloud server describe "$vm" >/dev/null 2>&1; then
            echo "Reaping own VM: $vm"
            hcloud server delete "$vm" || true
          else
            echo "Own VM $vm already gone (scenario trap cleaned up) — nothing to reap."
          fi
          exit 0
