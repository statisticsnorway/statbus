# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Fast Tests

# run-name — MACHINE-READ (STATBUS-285). NOT cosmetic, unlike the label on
# the LXD fault fleet (lxd-fleet.yaml).
#
# WHY IT EXISTS. For workflow_run-triggered workflows GitHub files the run's API
# head_sha under the DEFAULT BRANCH'S TIP AT TRIGGER TIME, not under the commit
# the run actually tested. Execution is pinned correctly (the ref step below
# resolves workflow_run.head_sha and the checkout uses it), but ATTRIBUTION is
# structurally wrong at the API — and no yaml can change what head_sha a run is
# filed under. Run 33096555771 was filed under 620cc7f0b while having tested
# 061b63d01, its ancestor. The release gate keys evidence on head_sha, so it can
# read a green about one commit as a green about another.
#
# So the run PUBLISHES the commit it exercised, in the one field computable at
# run-creation time and visible in the API runs list (display_title).
#
# WHY THIS IS NOT THE SELF-REPORT STATBUS-199 §5 REJECTED. That label described
# WHAT RAN (full suite vs subset) — a claim a dispatch input could falsify, which
# is why the gate moved to the job list instead. This one restates a TRIGGER
# CONTEXT VALUE that also drives the checkout: the same
# github.event.workflow_run.head_sha expression appears here and in the ref the
# code is checked out at, and a declarative test asserts they stay identical
# (TestWorkflowRunMarkerMatchesCheckoutRef_STATBUS285). The label cannot lie
# without the checkout lying in the same breath.
#
# Evaluated at run creation, BEFORE any job — so it cannot use a step output, and
# it exists even on runs that FAIL. That preserves red-vs-missing at the consumer:
# a marker carried only by a step output would make every red run unattributable
# and therefore Missing, re-opening STATBUS-256's do-not-just-re-run defect.
run-name: >-
  Fast Tests @ exercised-sha=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

# Fast Tests — pg_regress fast suite, gated to run AFTER the Images build.
#
# Trigger model:
#   - workflow_run on "Images" completion (fires for master pushes once Images
#     finishes): reuse the commit_short-tagged images Images just published —
#     PULL them, no local rebuild — and fetch the published seed image (which
#     also exercises the image-based seed-consume path end-to-end). Gated on
#     Images concluding 'success'.
#   - pull_request: Images doesn't run for PRs, so build images locally and seed
#     via FULL_REPLAY (STATBUS_DB_SEED_NO_FETCH=1).
#   - workflow_dispatch: manual; same build-local path as PRs.
#
# Why after Images (not parallel): the previous `push: master` trigger ran
# concurrently with images.yaml, so `docker compose pull` raced the not-yet-
# published images (and, lacking a GHCR login, failed auth) and fell back to a
# ~5-min local `up -d --build`. Sequencing behind Images + authenticating lets
# the pull hit, removing the rebuild.
#
# Self-contained on the GHA runner: checkout → build sb → docker compose up →
# migrate-and-test fast. No external servers / SSH.
#
# Release gate wiring (see doc/release-workflow-gates.md): the stable-release
# pre-flight (`./sb release stable`) gates on this workflow being green at the
# RC's commit, via release.WorkflowFastTests in cli/internal/release/
# workflow_check.go. SKIP_FAST_TESTS=1 is the surgical operator bypass. A run
# still exists per master commit — workflow_run fires once Images completes for
# that commit (the RC tags a master commit).
#
# Locally, ./dev.sh continous-integration-test runs the same fast SQL suite.

on:
  # If the master run was classified before the RC tag existed, its master
  # group may be cancelled. The tag event creates an independent run at the
  # exact candidate SHA, removing that classification race.
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:
  workflow_run:
    workflows: ["Images"]
    types: [completed]
    # STATBUS-433: the upgrade-arc harness `gh workflow run images.yaml --ref
    # <fixture-branch>` dispatches Images on throwaway test/upgrade-arc-*
    # branches (upgrade-target.sh). Without this filter every such Images
    # completion — success or the harness's deliberately-failing migrations —
    # also started a Fast Tests run here, classified candidate=false (no RC
    # tag on a fixture branch) and so landed in the SAME 'fast-tests-master'
    # concurrency group as master's own runs (cancel-in-progress: true).
    # 4 master runs were cancelled by fixture runs this way since 2026-09-27
    # (918e682a9, 4daee93fa, 34ca4a5b2, f22016803 run 36575920976); none of
    # those SHAs has a green Fast Tests run. The fixture runs also fail by
    # design, adding red noise unrelated to master's health.
    #
    # `branches` on workflow_run filters on the TRIGGERING RUN's head_branch
    # (github.event.workflow_run.head_branch), per GitHub's
    # on.workflow_run.<branches|branches-ignore> docs. Images' own `push`
    # trigger is already `branches: [master]`, so ordinary master-push Images
    # runs keep triggering Fast Tests unchanged. RC tags don't go through
    # this path (Fast Tests' `push: tags: ['v*-rc.*']` fires directly —
    # STATBUS-415). PRs use the separate `pull_request` trigger, untouched.
    # A manual `workflow_dispatch` of Images against master is unaffected; a
    # dispatch against any other branch is correctly excluded — the fixture
    # case this filter exists for. The concurrency group below is also
    # hardened (keyed on the exercised branch, not a fixed literal) as
    # defence in depth, in case a non-master run ever reaches this workflow
    # through another path.
    branches: [master]
  pull_request:
    branches-ignore:
      - 'ops/**'

# STATBUS-415: classify before assigning job concurrency. Workflow-level
# concurrency cannot inspect tags at the exercised workflow_run SHA. Ordinary
# master and PR runs still cancel superseded work (STATBUS-364), while each
# tagged candidate has its own group and survives later master pushes.
#
# STATBUS-433: the non-candidate, non-PR fallback group is keyed on the
# branch actually exercised (workflow_run.head_branch, or github.ref_name for
# push/workflow_dispatch), not a fixed 'fast-tests-master' literal. Otherwise
# a `gh workflow run fast-tests.yaml --ref <any-branch>` dispatch, or any
# other non-master run that reaches this fallback, would share master's group
# and could cancel its in-flight verdict — the same defect the trigger filter
# above closes, reached through a different door. Master runs still all key
# to 'fast-tests-master' and supersede each other (STATBUS-364 preserved).

permissions:
  contents: read
  packages: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.tag.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: tag
        env:
          EXERCISED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch --force --tags origin
          if git tag --points-at "$EXERCISED_SHA" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo 'candidate=true' >> "$GITHUB_OUTPUT"
          else
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
          fi

  fast-tests:
    needs: classify
    concurrency:
      group: ${{ needs.classify.outputs.candidate == 'true' && format('fast-tests-rc-{0}', github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha) || (github.event_name == 'pull_request' && format('fast-tests-{0}', github.ref) || format('fast-tests-{0}', github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name)) }}
      cancel-in-progress: true
    name: pg_regress fast suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Skip if Images failed (only applies to the workflow_run trigger).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Determine sha
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On the workflow_run path github.sha is the workflow file's commit, not
          # the tested one — check out the build's head_sha explicitly.
          ref: ${{ steps.ref.outputs.sha }}
          # fetch-depth: 0 so `git describe --tags` in ldflags stamping resolves
          # to a meaningful version string (not just the short SHA fallback).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          # STATBUS-235: go.mod/go.sum live in cli/, not the repo root —
          # without this, setup-go's cache lookup silently never found
          # go.sum, so GOCACHE was never actually restored (STATBUS-234
          # comment #1). SAFE ONLY because this workflow's own `go test`
          # invocation (below) already carries `-count=1` (STATBUS-234) —
          # never remove it.
          cache-dependency-path: cli/go.sum

      - name: Build sb binary
        working-directory: cli
        run: |
          set -euxo pipefail
          _VERSION=$(git -C .. describe --tags --always --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || echo "dev")
          _COMMIT=$(git -C .. rev-parse HEAD)
          CGO_ENABLED=0 go build \
            -ldflags "-X 'github.com/statisticsnorway/statbus/cli/cmd.version=${_VERSION}' -X 'github.com/statisticsnorway/statbus/cli/cmd.commit=${_COMMIT}'" \
            -trimpath -o ../sb .

      - name: Generate config
        # Matches the slot-1 development slot used by test-hardening.yaml's
        # install-stack job — same env shape, no port conflicts if both happen
        # to share a runner (different jobs; they don't). config generate writes
        # .env including COMMIT_SHORT (= git rev-parse --short=8 HEAD), which is
        # the image tag the compose files reference.
        env:
          DEPLOYMENT_SLOT_NAME: CI
          DEPLOYMENT_SLOT_CODE: ci
          DEPLOYMENT_SLOT_PORT_OFFSET: "1"
          CADDY_DEPLOYMENT_MODE: development
          SITE_DOMAIN: localhost
        run: |
          set -euxo pipefail
          cat > .env.config <<CFG
          DEPLOYMENT_SLOT_NAME=$DEPLOYMENT_SLOT_NAME
          DEPLOYMENT_SLOT_CODE=$DEPLOYMENT_SLOT_CODE
          DEPLOYMENT_SLOT_PORT_OFFSET=$DEPLOYMENT_SLOT_PORT_OFFSET
          CADDY_DEPLOYMENT_MODE=$CADDY_DEPLOYMENT_MODE
          SITE_DOMAIN=$SITE_DOMAIN
          CFG
          ./sb config generate

      - name: Log in to GHCR
        # workflow_run and RC-tag push reuse published images + request the seed;
        # PR/dispatch build locally and seed via FULL_REPLAY.
        if: github.event_name == 'workflow_run' || github.event_name == 'push'
        # Retried: a runner's resolver can time out on the first ghcr.io
        # lookup (Images run 40967128256 lost a whole build to one miss).
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin && exit 0
            [ "$attempt" -lt 5 ] && { echo "ghcr.io login attempt $attempt/5 failed; retrying in $((attempt * 10))s" >&2; sleep $((attempt * 10)); }
          done
          echo "::error title=ghcr.io login failed::5 attempts; registry or runner DNS unavailable" >&2
          exit 1

      - name: Start services
        run: |
          set -euxo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event_name }}" = "push" ]; then
            # workflow_run follows successful Images; RC-tag push relies on
            # the tag-cut publication preflight, without an artifact wait here.
            # Reuse commit_short-tagged images: authenticated pull, no build.
            # Strict: a pull failure fails the job rather than rebuilding.
            docker compose pull --quiet
            docker compose --profile all up -d
          else
            # PR / manual dispatch: Images doesn't run — build locally.
            docker compose --profile all up -d --build
          fi

      - name: Wait for DB
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker compose exec db pg_isready -U postgres 2>/dev/null; then
              echo "DB ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: DB not ready after 60s"
          docker compose logs db | tail -30
          exit 1

      - name: Verify regression diagnostic collection
        run: bash test/fast-ci-regression-diagnostics-test.sh .github/workflows/fast-tests.yaml tmp/fast-ci-diagnostics-selftest

      - name: Enable nested slow-query plans
        # STATBUS-596: diagnostic instrumentation adds overhead. These timings
        # are not performance acceptance evidence. Keep ordinary psql behavior.
        run: |
          set -euo pipefail
          echo "Diagnostic auto_explain adds overhead; instrumented timings are not performance acceptance evidence."
          docker compose exec -T db psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          LOAD 'auto_explain';
          -- safeupdate stays loaded alongside auto_explain, as in every session (postgres/postgresql.conf, STATBUS-604).
          ALTER SYSTEM SET session_preload_libraries = 'safeupdate,auto_explain';
          ALTER SYSTEM SET auto_explain.log_min_duration = '1000ms';
          ALTER SYSTEM SET auto_explain.log_nested_statements = 'on';
          ALTER SYSTEM SET auto_explain.log_analyze = 'on';
          ALTER SYSTEM SET auto_explain.log_timing = 'off';
          ALTER SYSTEM SET auto_explain.log_parameter_max_length = '0';
          ALTER SYSTEM SET log_parameter_max_length = '0';
          ALTER SYSTEM SET log_parameter_max_length_on_error = '0';
          SELECT pg_reload_conf() AS reloaded \gset
          \if :reloaded
          \else
          \quit 1
          \endif
          SQL
          verified=false
          for attempt in $(seq 1 10); do
            settings=$(docker compose exec -T db psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -At <<'SQL'
          WITH requested(ordinal, name) AS (VALUES
            (1, 'session_preload_libraries'), (2, 'auto_explain.log_min_duration'),
            (3, 'auto_explain.log_nested_statements'), (4, 'auto_explain.log_analyze'),
            (5, 'auto_explain.log_timing'), (6, 'auto_explain.log_parameter_max_length'),
            (7, 'log_parameter_max_length'), (8, 'log_parameter_max_length_on_error')
          )
          SELECT string_agg(coalesce(setting, '<missing>'), '|' ORDER BY ordinal)
          FROM requested LEFT JOIN pg_settings USING (name);
          SQL
            )
            echo "Fresh-connection profiling settings (attempt $attempt): $settings"
            if [ "$settings" = 'safeupdate,auto_explain|1000|on|on|off|0|0|0' ]; then
              verified=true
              break
            fi
            sleep 1
          done
          if [ "$verified" != true ]; then
            echo "::error::CI nested-plan settings did not become effective in a new connection."
            exit 1
          fi

      - name: Run fast test suite
        id: sql_tests
        # workflow_run / RC-tag push: request the published seed image
        # (statbus-seed:<commit_short>), exercising the seed-consume path.
        # The existing seed-fetch fallback to FULL_REPLAY remains unchanged.
        # PR / dispatch: no published seed for this commit, so FULL_REPLAY from
        # on-disk migrations (STATBUS_DB_SEED_NO_FETCH=1, ~3 min).
        #
        # migrate-and-test fast: bootstraps statbus_seed, creates
        # statbus_test_template (fast clone), runs pg_regress on all tests except
        # 4xx/5xx (large imports). Exits non-zero on any failure — no `|| true`.
        env:
          STATBUS_DB_SEED_NO_FETCH: ${{ (github.event_name == 'workflow_run' || github.event_name == 'push') && '0' || '1' }}
        run: |
          set -euxo pipefail
          ./dev.sh migrate-and-test fast

      - name: Daemon floor oracle
        # STATBUS-182: the empirical daemon-floor oracle's STANDING HOME. Provisions a
        # DB at EXACTLY DaemonSchemaFloor and PREPAREs every daemon boot/recovery query
        # against it — a green master proves the floor is sufficient. The floor now lags
        # the tree by design (the first lag was the STATBUS-178 import migration), so this
        # must run standing, forever. The floor value is DERIVED from the single source of
        # truth cli/internal/migrate/daemon_floor.go's DaemonSchemaFloor, never hardcoded
        # (TestFloorOracleWiredInCI asserts this wiring in the pure Go lane).
        run: |
          set -euxo pipefail
          FLOOR=$(grep -oE 'DaemonSchemaFloor[[:space:]]+int64[[:space:]]*=[[:space:]]*[0-9]+' cli/internal/migrate/daemon_floor.go | grep -oE '[0-9]+$')
          [ -n "$FLOOR" ] || { echo "::error::could not derive DaemonSchemaFloor from cli/internal/migrate/daemon_floor.go"; exit 1; }
          echo "Derived DaemonSchemaFloor=$FLOOR"
          # A bare template_statbus lacks the per-DB auth schema, so migrate.Up cannot run
          # on it directly (the refuted self-provisioning note in daemon_floor_empirical_test.go).
          # Reuse the seed-baseline primitive (`db seed create-db` = template_statbus + auth
          # grants) against a DEDICATED db name via a SCOPED POSTGRES_SEED_DB override, so the
          # real statbus_seed the pg_regress flow built stays untouched; reverted right after.
          ORIG_SEED=$(./sb dotenv -f .env get POSTGRES_SEED_DB || true)
          ./sb dotenv -f .env set POSTGRES_SEED_DB statbus_floor
          ./sb db seed create-db                        # statbus_floor at baseline (auth schema, no migrations)
          ./sb migrate up --target seed --to "$FLOOR"   # → EXACTLY the floor (NOT HEAD)
          ./sb dotenv -f .env set POSTGRES_SEED_DB "${ORIG_SEED:-statbus_seed}"
          # Point the oracle at the floor DB and run it STRICT (no continue-on-error). The
          # test's non-vacuity guard FAILS unless MAX(db.migration.version) == the floor.
          # -x off around the DSN so the generated PGPASSWORD never lands in the CI log.
          set +x
          eval "$(./sb config show --postgres)"
          export STATBUS_FLOOR_TEST_DSN="postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/statbus_floor?sslmode=${PGSSLMODE:-disable}"
          set -x
          ( cd cli && go test ./internal/migrate/ -run TestDaemonFloorSchemaSufficient -count=1 -v )

      - name: Live-database tests
        # STATBUS-362: real local DB coverage runs from detached per-package
        # worktrees with a pinned identity-bearing sb binary. The package flock
        # serializes install and upgrade because both use the same database.
        run: |
          set -euxo pipefail
          ./dev.sh test-livedb

      - name: Arc upgrade-state reader against the real schema (STATBUS-536)
        run: ARC_ROW_STATE_REQUIRE_DB=1 bash test/install-recovery/tests/arc-row-state-pending-finish-test.sh

      - name: Worker started read-only restores recurring tasks once writable (STATBUS-551)
        run: WORKER_IN_CONTAINER=1 bash test/worker-seed-read-only-test.sh

      - name: Capture PostgreSQL plans
        if: always() && (steps.sql_tests.outcome == 'success' || steps.sql_tests.outcome == 'failure')
        run: |
          set -euo pipefail
          mkdir -p tmp/fast-ci-regression
          # Bound-parameter suppression does not hide SQL literals. Redact known
          # CI configuration secrets and JWTs in memory before retaining logs.
          log_status=0
          : > tmp/fast-ci-regression/postgres.log.stderr
          python3 - <<'PY' 2> tmp/fast-ci-regression/postgres.collector.stderr || log_status=$?
          from pathlib import Path
          import re
          import subprocess
          import sys
          target = Path('tmp/fast-ci-regression')
          secrets = set()
          config_keys = set()
          for source in ('.env', '.env.credentials'):
              config = subprocess.run(['./sb', 'dotenv', '-f', source, 'parse'], capture_output=True)
              if config.returncode or not config.stdout:
                  (target / 'postgres.log.stderr').write_text('Cannot read CI configuration for log redaction.\n')
                  sys.exit(config.returncode or 1)
              for line in config.stdout.splitlines():
                  key, separator, value = line.partition(b'=')
                  if separator and value and re.search(rb'PASSWORD|SECRET|TOKEN|KEY|WEBHOOK', key, re.I):
                      secrets.update((value, value.replace(b"'", b"''")))
                      config_keys.add(key)
          if not {b'JWT_SECRET', b'POSTGRES_ADMIN_PASSWORD'} <= config_keys:
              (target / 'postgres.log.stderr').write_text('Cannot read CI configuration for log redaction.\n')
              sys.exit(1)
          logs = subprocess.run(['docker', 'compose', 'logs', '--no-color', 'db'], capture_output=True)
          for name, data in (('postgres.log', logs.stdout), ('postgres.log.stderr', logs.stderr)):
              for value in sorted(secrets, key=len, reverse=True):
                  data = data.replace(value, b'[REDACTED]')
              data = re.sub(rb'\beyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b', b'[REDACTED JWT]', data)
              if any(value in data for value in secrets):
                  raise RuntimeError('CI log redaction check failed')
              (target / name).write_bytes(data)
          sys.exit(logs.returncode)
          PY
          printf '%s\n' "$log_status" > tmp/fast-ci-regression/postgres.log.status
          cat tmp/fast-ci-regression/postgres.log.stderr tmp/fast-ci-regression/postgres.collector.stderr >&2
          exit "$log_status"

      - name: Show regression diffs on failure
        if: always() && steps.sql_tests.outcome == 'failure'
        run: |
          set -euo pipefail
          mkdir -p tmp/fast-ci-regression
          status=0
          # A passing isolated pg_regress child can remove both summaries.
          # The host summary can also be unreadable to the runner.
          if [ -f test/regression.out ] && [ -r test/regression.out ]; then
            cp test/regression.out tmp/fast-ci-regression/host-regression.out
            cat tmp/fast-ci-regression/host-regression.out
          else
            echo "Host pg_regress summary unreadable or absent; collecting container results."
          fi
          for file in regression.out regression.diffs; do
            echo "=== db:/statbus/test/$file ==="
            docker compose exec -T --workdir /statbus db cat "/statbus/test/$file" \
              2> "tmp/fast-ci-regression/$file.stderr" \
              | tee "tmp/fast-ci-regression/$file" || status=$?
            cat "tmp/fast-ci-regression/$file.stderr" >&2
          done
          # Per-test outputs survive different-name isolated children even when
          # regression.out/diffs are removed. Extract as the runner, not the
          # container's owner, so mode-600 outputs remain readable.
          docker compose exec -T --workdir /statbus db \
            tar -cf - -C /statbus/test results \
            > tmp/fast-ci-regression/results.tar \
            2> tmp/fast-ci-regression/results.tar.stderr || status=$?
          cat tmp/fast-ci-regression/results.tar.stderr >&2
          if [ -s tmp/fast-ci-regression/results.tar ]; then
            tar --no-same-owner -xf tmp/fast-ci-regression/results.tar \
              -C tmp/fast-ci-regression \
              2> tmp/fast-ci-regression/results.extract.stderr || status=$?
            cat tmp/fast-ci-regression/results.extract.stderr >&2
          fi
          mkdir -p tmp/fast-ci-regression/diffs
          shopt -s nullglob
          found_result=false
          for result in tmp/fast-ci-regression/results/*.out; do
            found_result=true
            name=${result##*/}
            diff_status=0
            diff -u --label "test/expected/$name" --label "db:/statbus/test/results/$name" \
              "test/expected/$name" "$result" \
              > "tmp/fast-ci-regression/diffs/$name.diff" \
              2> "tmp/fast-ci-regression/diffs/$name.stderr" || diff_status=$?
            if [ "$diff_status" -ne 0 ]; then
              echo "=== per-test diff: $name ==="
              cat "tmp/fast-ci-regression/diffs/$name.diff"
              cat "tmp/fast-ci-regression/diffs/$name.stderr" >&2
              # diff=1 is the expected SQL mismatch, not a collection error.
              if [ "$diff_status" -gt 1 ]; then status=$diff_status; fi
            fi
          done
          if [ "$found_result" = false ]; then
            echo "::error::No per-test pg_regress outputs recovered."
            if [ "$status" -eq 0 ]; then status=1; fi
          fi
          exit "$status"

      - name: Upload regression diagnostics
        if: always() && (steps.sql_tests.outcome == 'success' || steps.sql_tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: fast-ci-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/fast-ci-regression/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose --profile all down -v || true
