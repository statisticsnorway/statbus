# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Harness Selftest

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'test/install-recovery/**'
      - 'test/install/**'
      - 'ops/setup-ubuntu-lts.sh'
      - 'ops/release/**'
      - 'ops/lxd-fleet/**'
      - 'install.sh'
      - '.github/actions/**'
      - '.github/workflows/harness-selftest.yaml'
      - 'dev.sh'

permissions:
  contents: read

jobs:
  harness-selftest:
    runs-on: ubuntu-24.04
    # 20 min: the job runs dozens of tests; two carry their own bounded
    # watchdogs (lxd-run-arcs-finalize-test 420 s, lxd-stop-running-jobs-test
    # ~240 s), which alone exceeded the former 5 min cap. Not a performance gate.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # github-token-era-test.sh resolves historical era commits
          # (626bc0d9b, 730b5001c, d53731ec5), exactly as the real arcs do.
          fetch-depth: 0
      - name: Install localhost sshd and tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server tmux
      - name: Prove harness failure paths
        run: ./dev.sh test-harness
      - name: Prove public installer failures stay useful and redacted
        run: |
          bash test/install/install-git-errors-test.sh
          bash test/install/install-git-fetch-compatibility-test.sh
          bash test/install/install-pull-failure-test.sh
      - name: Prove install mutex handoff is gapless and never steals a healthy hold
        run: bash test/install-recovery/tests/install-gapless-handoff-test.sh
      - name: Prove LXD base pruning selects only superseded candidates
        run: bash test/install-recovery/tests/lxd-base-prune-test.sh
      - name: Prove LXD file push retries only the forkfile idle-exit race
        run: bash test/install-recovery/tests/lxd-push-retry-test.sh
      - name: Prove smoke publishes only its own healthy running fork as a checkpoint
        run: bash test/install-recovery/tests/lxd-smoke-checkpoint-test.sh
      - name: Prove smoke's upgrade-leg checkpoint identity matches what its own fork resolves
        run: bash test/install-recovery/tests/lxd-checkpoint-identity-test.sh
      - name: Prove cleanup_vm captures failure diagnostics before deleting, across every trap shape
        run: bash test/install-recovery/tests/lxd-cleanup-capture-order-test.sh
      - name: Prove base pruning refuses with no active occupancy marker
        run: bash test/install-recovery/tests/lxd-prune-guard-test.sh
      - name: Prove the fleet marker refuses while reaping or hardening is active
        run: bash test/install-recovery/tests/lxd-marker-guard-test.sh
      - name: Prove LXD host staging paths are unique per invocation and cleaned up
        run: bash test/install-recovery/tests/lxd-staging-path-test.sh
      - name: Prove bootstrap_install_test_vm routes on VM name, never on whether INSTALL_VERSION is empty
        run: bash test/install-recovery/tests/lxd-bootstrap-discriminator-test.sh
      - name: Prove every env-config pre-copy install path creates ~/statbus-maintenance first
        run: bash test/install-recovery/tests/lxd-maintenance-dir-ownership-test.sh
      - name: Prove run-arcs.sh's fixture-lineage mapping never drifts from upgrade-arc-harness.yaml's
        run: bash test/install-recovery/tests/lxd-arc-lineage-parity-test.sh
      - name: Prove an arc's candidate base installs by commit identity, even when a stable tag also points at it
        run: bash test/install-recovery/tests/lxd-arc-base-identity-test.sh
      - name: Prove the pre-commit hook's upgrade-arc fixture exemption covers every V_N, never swallows a real migration
        run: bash test/install-recovery/tests/precommit-arc-fixture-exemption-test.sh
      - name: Prove capture_db_fingerprint scopes its schema scratch file per VM_NAME, never a fixed path
        run: bash test/install-recovery/tests/arc-fingerprint-path-scope-test.sh
      - name: Prove arc_wait_unit_active enforces its budget in every branch
        run: bash test/install-recovery/tests/arc-wait-unit-active-test.sh
      - name: Prove the LXD driver's bounded run, tree stop and stale-holder lock
        run: bash test/install-recovery/tests/lxd-driver-lifecycle-test.sh
      - name: Prove run-arcs finalize stops owned children first, restores the pinned tree only under its lock, and survives early exits
        run: bash test/install-recovery/tests/lxd-run-arcs-finalize-test.sh
      - name: LXD host admission (slots, busy, sweep)
        run: bash test/install-recovery/tests/lxd-admission-test.sh
      - name: LXD shared arc runner verdict
        run: bash test/install-recovery/tests/lxd-arc-verdict-test.sh
      - name: LXD exact-SHA arc A checkpoints
        run: bash test/install-recovery/tests/lxd-arc-a-checkpoint-test.sh
      - name: LXD snapshot layers (installed-candidate start, demo layer)
        run: bash test/install-recovery/tests/lxd-snapshot-layers-test.sh
      - name: LXD arc always-reap (killed job ownership)
        run: bash test/install-recovery/tests/lxd-arc-reap-test.sh
      - name: LXD stop_running_jobs (finalize job stop)
        run: bash test/install-recovery/tests/lxd-stop-running-jobs-test.sh
      - name: Prove c-rollback-resurrection's V_VERSION_2/V_VERSION_3 guards both fire
        run: bash test/install-recovery/tests/arc-crollback-version-guard-test.sh
      - name: Prove the HTTPS-only egress contract holds on both backends (STATBUS-357/485)
        run: bash test/install-recovery/tests/https-only-egress-test.sh
      - name: Prove each HTTPS-only egress rule mutation turns the contract red on both backends (STATBUS-485)
        run: bash test/install-recovery/tests/https-only-egress-mutation-test.sh
      - name: Prove 0-https-only-egress is in the default scenario set and on-demand cases stay out (STATBUS-357/485)
        run: bash test/install-recovery/tests/scenario-selection-test.sh
      - name: Prove the HTTPS-only scenario resolves to Ubuntu 26.04 and is not parked on-demand (STATBUS-485)
        run: bash test/install-recovery/tests/vm-image-selection-test.sh
      - name: Prove LXD checkpoint resolution follows every scenario delegation spelling (STATBUS-485)
        run: bash test/install-recovery/tests/lxd-checkpoint-identity-test.sh
      - name: Prove setup-ubuntu-lts.sh refuses plain sudo from an operator home (STATBUS-492)
        run: bash test/install-recovery/tests/setup-plain-sudo-guard-test.sh
      - name: Prove the setup script retries apt, refreshes the index, and stops at its bound (STATBUS-494)
        run: bash test/install-recovery/tests/setup-apt-retry-test.sh
      - name: Prove the SSH stage confirms remote access before disabling password auth (STATBUS-495)
        run: bash test/install-recovery/tests/setup-remote-access-gate-test.sh
      - name: Prove the setup script enables automatic reboots and announces the configured hour (STATBUS-496)
        run: bash test/install-recovery/tests/setup-auto-reboot-test.sh
      - name: Prove the security stage installs CrowdSec before the bouncer and requires a working key (STATBUS-498)
        run: bash test/install-recovery/tests/setup-crowdsec-bouncer-order-test.sh
      - name: Prove the Docker stage grants and verifies access for the account that will use it (STATBUS-500)
        run: bash test/install-recovery/tests/setup-docker-access-test.sh
      - name: Prove cloud configuration is applied only with cloud intent (STATBUS-501)
        run: bash test/install-recovery/tests/setup-cloud-only-config-test.sh
      - name: Prove the end-of-run summary is true and names no channel (STATBUS-502)
        run: bash test/install-recovery/tests/setup-summary-truth-test.sh
      - name: Prove the setup prompts state their purpose and that a blank email is safe (STATBUS-490)
        run: bash test/install-recovery/tests/setup-prompt-purpose-test.sh
      - name: Prove the CI deploy-key question is asked only with --cloud (STATBUS-491)
        run: bash test/install-recovery/tests/setup-cloud-deploy-key-prompt-test.sh
      - name: Prove the prepare fetch uses the setup script of the release being installed (STATBUS-488)
        run: bash test/install-recovery/tests/setup-release-matched-fetch-test.sh
      - name: Prove setup-ubuntu-lts.sh Stage 0 decides by HTTP probe, not by asking (STATBUS-493)
        run: bash test/install-recovery/tests/setup-stage0-http-probe-test.sh
      - name: Prove EXTRA_LOCALES accepts a .UTF-8 suffix and makes macOS no_NO.UTF-8 resolve (STATBUS-489)
        run: bash test/install-recovery/tests/setup-extra-locales-test.sh
      - name: Prove the hardening firewall opens the port sshd really listens on, or refuses (STATBUS-506)
        run: bash test/install-recovery/tests/setup-ssh-port-firewall-test.sh
      - name: Prove setup resolves the server's full name before StatBus install
        run: bash test/install-recovery/tests/setup-fqdn-test.sh
      - name: Prove published scripts state the release they belong to (STATBUS-537)
        run: bash test/install-recovery/tests/release-script-stamp-test.sh
      - name: Prove every ghcr.io login step retries transient failures (STATBUS-535)
        run: bash test/ci-ghcr-login-retry-test.sh
      # These standalone harness tests existed but no workflow ran them, so
      # fresh-installer-test.sh went red with STATBUS-487 (d5f7b6503, its fixture
      # docker failed the new `docker info` preflight) and stayed red for a week
      # unnoticed. Run every standalone test here. Excluded: fake-lxc.sh (a sourced
      # helper) and process-log-host-guest-test.sh (driven with its arguments by
      # process-log-registration-test.sh via ./dev.sh test-harness).
      - name: Prove the remaining standalone install-recovery harness tests
        run: |
          set -euo pipefail
          for t in \
            arc-state-assertions-test.sh \
            c-rollback-resurrection-fixture-test.sh \
            concurrent-install-observation-test.sh \
            db-query-retry-test.sh \
            dev-seed-restore-test.sh \
            fresh-installer-test.sh \
            happy-install-test.sh \
            inject-stall-probe-test.sh \
            install-at-sha-test.sh \
            location-fallback-test.sh \
            lxd-verdict-test.sh \
            operator-config-test.sh \
            partial-allocation-cleanup-test.sh \
            rc10-schema-floor-family-test.sh \
            release-baseline-test.sh \
            run-boundary-test.sh \
            setup-apt-sources-test.sh \
            setup-supported-version-test.sh \
            watch-decisions-test.sh; do
            echo "::group::$t"
            bash "test/install-recovery/tests/$t"
            echo "::endgroup::"
          done
