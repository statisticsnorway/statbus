# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: LXD Fork Fleet (advisory parity)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: lxd-fork-fleet
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      STATBUS_CREDENTIALS_FILE: /home/runner/work/_temp/lxd-credentials
      JCODE_SCRATCH_DIR: /home/runner/work/_temp
      LXD_FLEET_ARTIFACT_DIR: /home/runner/work/_temp/lxd-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install box key and tooling
        env:
          BOX_KEY: ${{ secrets.LXD_FLEET_SSH_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/install-hcloud.sh
          install -m 700 -d ~/.ssh
          printf '%s\n' "$BOX_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'HCLOUD_TOKEN=%q\n' "$HCLOUD_TOKEN" > "$STATBUS_CREDENTIALS_FILE"
          chmod 600 "$STATBUS_CREDENTIALS_FILE"
      - name: Check freshness before any paid operation
        id: freshness
        uses: ./.github/actions/scenario-superseded
        with:
          candidate-ref: ${{ github.ref_name }}
          scenario: lxd-fleet
      - name: Wait for previous fleet to drain (bounded 20 minutes)
        if: steps.freshness.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          if ! hcloud server describe statbus-lxd-fleet -o json >/dev/null 2>&1; then
            echo 'No existing fleet box; ramp can proceed.'
            exit 0
          fi
          ip=$(hcloud server describe statbus-lxd-fleet -o json | jq -er '.public_net.ipv4.ip')
          for attempt in $(seq 1 120); do
            # Existing box may be absent before up.sh ramps it. A live active
            # marker belongs to the previous candidate; never race its forks.
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 "root@$ip" \
                'test ! -e /root/fleet-run.active && test ! -e /root/fleet-hardening.active && guests=$(lxc list --format csv) && ! grep -q RUNNING <<< "$guests"' 2>/dev/null; then
              echo 'Previous LXD fleet drained.'
              exit 0
            fi
            if [ "$attempt" -eq 120 ]; then
              echo '::error title=LXD fleet occupied::previous candidate did not drain within 20 minutes'
              exit 1
            fi
            echo "Waiting for previous LXD fleet to drain ($attempt/120)"
            sleep 10
          done
      - name: Recheck newest RC after occupancy wait
        id: after-wait
        if: steps.freshness.outputs.superseded != 'true'
        uses: ./.github/actions/scenario-superseded
        with:
          candidate-ref: ${{ github.ref_name }}
          scenario: lxd-fleet-after-wait
      - name: Ramp warm box
        if: steps.freshness.outputs.superseded != 'true' && steps.after-wait.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          ops/lxd-fleet/up.sh | tee "$RUNNER_TEMP/lxd-ramp.log"
          ip=$(tail -n 1 "$RUNNER_TEMP/lxd-ramp.log")
          [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'up.sh did not return an IPv4 address'; exit 1; }
          echo "LXD_HOST=root@$ip" >> "$GITHUB_ENV"
          echo "Fleet host resolved by name: $ip"
      - name: Build or reuse candidate base
        if: steps.freshness.outputs.superseded != 'true' && steps.after-wait.outputs.superseded != 'true'
        run: ops/lxd-fleet/base.sh "${{ github.ref_name }}"
      - name: Run all fork scenarios (batch-boundary supersession)
        if: steps.freshness.outputs.superseded != 'true' && steps.after-wait.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$LXD_HOST" \
            'flock /root/fleet-run.lock bash -c "test ! -e /root/fleet-run.active && test ! -e /root/fleet-hardening.active && touch /root/fleet-run.active"'
          trap 'ssh -o BatchMode=yes "$LXD_HOST" "rm -f /root/fleet-run.active; date +%s > /root/last-fleet-activity"' EXIT
          test/install-recovery/lxd/run-forks.sh "${{ github.ref_name }}"
      - name: Preserve pre-run supersession in parity artifact
        if: always()
        env:
          FIRST: ${{ steps.freshness.outputs.superseded }}
          AFTER_WAIT: ${{ steps.after-wait.outputs.superseded }}
        run: |
          if [ "$FIRST" = true ] || [ "$AFTER_WAIT" = true ]; then
            mkdir -p "$LXD_FLEET_ARTIFACT_DIR"
            echo SUPERSEDED > "$LXD_FLEET_ARTIFACT_DIR/fleet-status.txt"
          fi
      - name: Upload comparison and per-scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lxd-fleet-comparison
          path: ${{ runner.temp }}/lxd-artifacts/
          if-no-files-found: warn
      - name: State LXD verdict
        if: always()
        run: |
          if [ "${{ steps.freshness.outputs.superseded }}" = true ] || [ "${{ steps.after-wait.outputs.superseded }}" = true ] || [ -f "$LXD_FLEET_ARTIFACT_DIR/fleet-status.txt" ]; then
            echo '### LXD parity: SUPERSEDED (ADVISORY ONLY)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### LXD parity: see job conclusion and comparison artifact (ADVISORY ONLY)' >> "$GITHUB_STEP_SUMMARY"
          fi
