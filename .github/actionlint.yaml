# actionlint config — https://github.com/rhysd/actionlint/blob/main/docs/config.md
self-hosted-runner:
  labels:
    - niue

# actionlint 1.7.12 predates GitHub's documented concurrency.queue key. Keep
# this exception path-scoped to the exact parsed fleet set pinned by Go tests.
paths:
  .github/workflows/test-smoke.yaml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/install-recovery-harness.yaml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/upgrade-arc-harness.yaml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
