# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Aggregate scenario freshness
description: Produce a machine-readable fleet verdict from every matrix scenario marker.
inputs:
  matrix-json:
    description: Exact scenario matrix JSON emitted by the selection job.
    required: true
outputs:
  superseded:
    description: 'true when at least one VM scenario stopped for a newer candidate'
    value: ${{ steps.aggregate.outputs.superseded }}
runs:
  using: composite
  steps:
    - name: Download all scenario freshness markers
      uses: actions/download-artifact@v4
      with:
        pattern: scenario-freshness-*
        path: ${{ runner.temp }}/scenario-freshness-aggregate
        merge-multiple: true
    - name: Count and classify all scenario markers
      id: aggregate
      shell: bash
      env:
        MATRIX_JSON: ${{ inputs.matrix-json }}
        MARKER_DIR: ${{ runner.temp }}/scenario-freshness-aggregate
      run: bash "${{ github.action_path }}/aggregate.sh"
    - name: Publish fleet verdict for the dispatching workflow
      uses: actions/upload-artifact@v4
      with:
        name: fleet-verdict
        path: ${{ steps.aggregate.outputs.verdict-file }}
        if-no-files-found: error
        retention-days: 1
