# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Dispatch fleet workflow and wait for conclusion
description: >-
  STATBUS-225: single home for the dispatch/correlate/poll logic
  release-fleet-orchestrator.yaml's three jobs used to each carry an
  independent, near-identical ~70-line copy of. The deploy-to-*.yaml
  convention of duplicating dispatch/poll loops at their call site is
  deliberate ACROSS files, where each copy has an independent reason to
  exist (STATBUS-208's concurrency comment explains why); inside ONE file,
  three copies of the same subtle rule just drift — the STATBUS-214 review's
  run-correlation amendment had to be re-applied three times, correctly, and
  that pressure is exactly what this extraction removes. Callers pay one
  checkout (seconds) for a single home instead of diffing three blocks
  against each other to confirm they still agree.
inputs:
  workflow-file:
    description: 'The workflow filename to dispatch (e.g. test-install.yaml).'
    required: true
  ref:
    description: 'The git ref to dispatch at (the tag name or branch).'
    required: true
  commit-sha:
    description: 'The commit SHA `ref` resolves to, for run correlation (github.sha of the caller).'
    required: true
  dispatch-inputs:
    description: >-
      Optional workflow_dispatch inputs, one `key=value` per line, passed
      through as `-f key=value`. STATBUS-260: the dev-canary leg names the
      candidate commit explicitly rather than relying on a branch push to imply
      it. Empty for callers that need no inputs, which is every other caller —
      so this is additive and changes nothing for them.
    required: false
    default: ''
  poll-budget-s:
    description: 'Seconds to poll for the dispatched run''s conclusion before timing out.'
    required: true
  github-token:
    description: 'Token with actions:write (dispatch) and actions:read (list/view) scope.'
    required: true
outputs:
  run-url:
    description: 'The html_url of the run this action dispatched and waited on.'
    value: ${{ steps.dispatch.outputs.run_url }}
runs:
  using: composite
  steps:
    - name: Dispatch, correlate, and wait for conclusion
      id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        REF: ${{ inputs.ref }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        POLL_BUDGET_S: ${{ inputs.poll-budget-s }}
        DISPATCH_INPUTS: ${{ inputs.dispatch-inputs }}
      run: bash "${{ github.action_path }}/dispatch.sh"
